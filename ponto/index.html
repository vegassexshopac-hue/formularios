<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Las Vegas · Portal da Equipe</title>
<meta name="theme-color" content="#15100D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" id="fav" href="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --noite:#15100D;--noite2:#1E1613;--veludo:#2A1B18;--veludo2:#36241F;
  --vermelho:#E3101F;--vermelho2:#B30A17;--dourado:#F5B524;--dourado2:#FFD15C;--ouro-escuro:#A8740E;
  --creme:#FFF4E0;--creme2:rgba(255,244,224,.68);--creme3:rgba(255,244,224,.42);
  --linha:rgba(255,244,224,.10);--linha2:rgba(255,244,224,.2);
  --ok:#3DDC97;--ok-bg:rgba(61,220,151,.14);--info:#7FB7FF;--info-bg:rgba(127,183,255,.14);
  --warn:#FFC857;--warn-bg:rgba(255,200,87,.14);--bad:#FF6B6B;--bad-bg:rgba(255,107,107,.14);
  --font:'Bricolage Grotesque',system-ui,sans-serif;
  --r:18px;--sh:0 10px 30px rgba(0,0,0,.35);
}
html,body{background:var(--noite);color:var(--creme);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{min-height:100vh;background:
  radial-gradient(900px 500px at 50% -10%, rgba(227,16,31,.22), transparent 60%),
  radial-gradient(700px 400px at 100% 100%, rgba(245,181,36,.08), transparent 60%),
  var(--noite)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--creme)}
a{color:var(--dourado2)}
.wrap{max-width:1040px;margin:0 auto;padding:16px 16px 110px;animation:entra .35s ease-out both}
@keyframes entra{from{opacity:0;transform:translateY(10px)}}
.hide{display:none!important}
.suave{color:var(--creme2)}.apagado{color:var(--creme3)}
.linha{display:flex;align-items:center;gap:10px}.entre{justify-content:space-between}.quebra{flex-wrap:wrap}
.cresce{flex:1;min-width:0}
.num{font-variant-numeric:tabular-nums}

/* ───── letreiro ───── */
.letreiro{position:relative;display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:22px;background:linear-gradient(160deg,var(--veludo2),var(--veludo));border:1.5px solid rgba(245,181,36,.45);box-shadow:var(--sh),inset 0 0 0 1px rgba(255,244,224,.04);margin-bottom:18px;overflow:visible}
.letreiro img{height:52px;width:auto;filter:drop-shadow(0 2px 8px rgba(0,0,0,.4))}
.letreiro h1{font-size:19px;font-weight:800;letter-spacing:-.01em;line-height:1.1;font-variation-settings:'opsz' 96}
.letreiro .sub{font-size:13px;color:var(--dourado);font-weight:600}
.lampadas{position:absolute;inset:-7px;pointer-events:none;border-radius:28px}
.lampadas i{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--ouro-escuro);box-shadow:0 0 0 rgba(255,209,92,0);animation:pisca 2.6s ease-in-out infinite;animation-delay:calc(var(--i) * -.13s)}
.lampadas.correndo i{animation:corre 1.6s linear 1, pisca 2.6s ease-in-out infinite 1.6s}
@keyframes pisca{0%,100%{background:var(--ouro-escuro);box-shadow:0 0 0 rgba(255,209,92,0)}50%{background:var(--dourado2);box-shadow:0 0 10px 2px rgba(255,209,92,.55)}}
@keyframes corre{0%,70%,100%{background:var(--ouro-escuro);box-shadow:none}10%,30%{background:var(--dourado2);box-shadow:0 0 12px 3px rgba(255,209,92,.7)}}
.relogio{margin-left:auto;text-align:right;line-height:1}
.relogio b{font-size:34px;font-weight:800;letter-spacing:-.02em;color:var(--creme);font-variation-settings:'opsz' 96}
.relogio span{display:block;font-size:12.5px;color:var(--creme3);margin-top:4px;text-transform:capitalize}

/* ───── superfícies ───── */
.cartao{background:var(--veludo);border:1px solid var(--linha);border-radius:var(--r);box-shadow:var(--sh)}
.pad{padding:18px}
h2.secao{font-size:15px;font-weight:700;color:var(--dourado);margin:22px 4px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
h2.secao small{font-size:12px;font-weight:500;color:var(--creme3)}
h2.secao:first-child{margin-top:0}

/* ───── botões ───── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:12px;font-weight:700;font-size:15px;border:1px solid var(--linha2);background:var(--veludo2);color:var(--creme);transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--vermelho);border-color:var(--vermelho);color:#fff;box-shadow:0 6px 18px rgba(227,16,31,.35)}
.btn.ouro{background:var(--dourado);border-color:var(--dourado);color:#2A1B18}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#0f2a1f}
.btn.fantasma{border-color:transparent;background:transparent;color:var(--creme2)}
.btn.p{height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn.largo{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.icone{width:40px;height:40px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;color:var(--creme2);border:1px solid var(--linha)}
.icone:hover{background:var(--veludo2)}
.voltar{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px 0 12px;border-radius:12px;background:var(--creme);color:var(--noite);font-weight:800;font-size:15px;margin-bottom:14px}
.voltar i{font-size:20px}

/* ───── abas / selos ───── */
.abas{display:flex;gap:4px;background:var(--noite2);padding:4px;border-radius:14px;overflow-x:auto;scrollbar-width:none;border:1px solid var(--linha)}
.abas::-webkit-scrollbar{display:none}
.aba{flex:1;white-space:nowrap;height:40px;padding:0 14px;border-radius:10px;font-weight:700;font-size:14px;color:var(--creme2);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.aba.on{background:var(--vermelho);color:#fff}
.contador{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--dourado);color:#2A1B18;font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.selo{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 10px;border-radius:13px;font-size:12.5px;font-weight:700;background:var(--veludo2);color:var(--creme2);white-space:nowrap;border:1px solid var(--linha)}
.selo.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}.selo.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.selo.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}.selo.info{background:var(--info-bg);color:var(--info);border-color:transparent}
.ponto{width:10px;height:10px;border-radius:50%;flex-shrink:0;display:inline-block}

/* ───── pessoas ───── */
.pessoas{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.pessoa{display:flex;align-items:center;gap:12px;padding:16px;border-radius:18px;background:var(--veludo);border:1px solid var(--linha);box-shadow:var(--sh);text-align:left;transition:border-color .15s,transform .1s}
.pessoa:hover{border-color:var(--dourado)}.pessoa:active{transform:scale(.98)}
.avatar{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#1A1210;flex-shrink:0;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.pessoa b{display:block;font-size:16px;font-weight:800;line-height:1.15}
.pessoa small{font-size:12.5px;color:var(--creme3);font-weight:500}

/* ───── PIN ───── */
.veu{position:fixed;inset:0;background:rgba(10,6,5,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--veludo);border:1px solid var(--linha2);border-radius:22px;width:100%;max-width:440px;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.6);animation:pop .2s}
.modal.largo{max-width:660px}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}}
.modal-t{display:flex;align-items:center;gap:12px;padding:18px 18px 0}
.modal-t h3{font-size:18px;font-weight:800}
.modal-c{padding:18px}
.pin-pontos{display:flex;justify-content:center;gap:12px;margin:8px 0 6px}
.pin-pontos i{width:16px;height:16px;border-radius:50%;border:2px solid var(--linha2)}
.pin-pontos i.on{background:var(--dourado);border-color:var(--dourado);box-shadow:0 0 10px rgba(245,181,36,.5)}
.pin-pontos.err i{border-color:var(--bad)}
.pin-erro{text-align:center;color:var(--bad);font-size:13.5px;font-weight:700;min-height:20px}
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.tecla{height:64px;border-radius:16px;background:var(--veludo2);border:1px solid var(--linha);font-size:26px;font-weight:700;color:var(--creme)}
.tecla:active{background:var(--noite2)}
.tecla.fn{font-size:15px;color:var(--creme2)}

/* ───── bater ponto ───── */
.hoje-grade{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.vaga{border-radius:14px;border:1px solid var(--linha);background:var(--noite2);padding:12px 8px;text-align:center}
.vaga small{display:block;font-size:12px;font-weight:700;color:var(--creme3)}
.vaga b{display:block;font-size:22px;margin-top:3px;color:var(--creme3)}
.vaga.feita b{color:var(--creme)}.vaga.feita{background:var(--veludo2)}
.vaga.proxima{border:2px solid var(--dourado);background:rgba(245,181,36,.08)}
.vaga.proxima small{color:var(--dourado)}
.ola{font-size:28px;font-weight:800;letter-spacing:-.01em;font-variation-settings:'opsz' 96}
.camera{position:relative;width:88px;height:88px;border-radius:50%;overflow:hidden;background:var(--noite2);border:3px solid var(--dourado);flex-shrink:0;box-shadow:0 0 0 4px rgba(245,181,36,.15)}
.camera video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
.camera .sem{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:11px;color:var(--creme3);text-align:center;gap:2px}
.camera .sem i{font-size:22px}
.botao-ponto{position:relative;width:100%;height:76px;border-radius:20px;background:linear-gradient(180deg,#FF3B49,var(--vermelho) 55%,var(--vermelho2));color:#fff;font-size:22px;font-weight:800;letter-spacing:.01em;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 10px 30px rgba(227,16,31,.45),inset 0 1px 0 rgba(255,255,255,.35);animation:pulso 2.2s ease-in-out infinite}
.botao-ponto i{font-size:28px}
.botao-ponto:active{transform:scale(.98)}
.botao-ponto[disabled]{animation:none;opacity:.6}
@keyframes pulso{0%,100%{box-shadow:0 10px 30px rgba(227,16,31,.45),0 0 0 0 rgba(227,16,31,.5)}60%{box-shadow:0 10px 30px rgba(227,16,31,.45),0 0 0 16px rgba(227,16,31,0)}}
.sucesso{text-align:center;padding:30px 12px;position:relative;overflow:hidden}
.check{width:96px;height:96px;margin:0 auto}
.check circle{fill:none;stroke:var(--ok);stroke-width:4;stroke-dasharray:300;stroke-dashoffset:300;animation:traco .6s ease-out forwards}
.check path{fill:none;stroke:var(--ok);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:80;stroke-dashoffset:80;animation:traco .4s ease-out .45s forwards}
@keyframes traco{to{stroke-dashoffset:0}}
.sucesso b.hora{display:block;font-size:64px;font-weight:800;letter-spacing:-.03em;margin-top:8px;font-variation-settings:'opsz' 96}
.confete{position:absolute;top:40%;left:50%;width:10px;height:14px;border-radius:2px;opacity:0;animation:voa 1.3s ease-out forwards;animation-delay:var(--d)}
@keyframes voa{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(540deg)}}

/* ───── atalhos ───── */
.atalhos{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.atalhos button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px 8px;border-radius:16px;background:var(--veludo);border:1px solid var(--linha);box-shadow:var(--sh);font-weight:700;font-size:14px;line-height:1.2;text-align:center;min-height:100px;color:var(--creme)}
.atalhos button:hover{border-color:var(--dourado)}
.atalhos button i{font-size:28px;color:var(--dourado)}
@media (max-width:640px){.atalhos{grid-template-columns:1fr 1fr}}

/* ───── números ───── */
.numeros{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.numero{padding:14px 16px;border-radius:16px;background:var(--veludo);border:1px solid var(--linha)}
.numero small{display:block;font-size:12.5px;font-weight:600;color:var(--creme3)}
.numero b{display:block;font-size:26px;font-weight:800;margin-top:2px;letter-spacing:-.02em;font-variation-settings:'opsz' 96}
.numero span{font-size:12.5px;color:var(--creme2)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.medidor{height:8px;border-radius:4px;background:var(--noite2);overflow:hidden;margin-top:8px}
.medidor i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--dourado),var(--dourado2));transition:width .6s ease-out}

/* ───── lista de dias ───── */
.dias{display:flex;flex-direction:column;gap:6px}
.dia{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:center;padding:11px 14px;border-radius:14px;background:var(--veludo);border:1px solid var(--linha);text-align:left;width:100%;color:var(--creme)}
.dia:hover{border-color:var(--linha2)}
.dia.dom{background:transparent;border-style:dashed;opacity:.65}
.dia.futuro{opacity:.5}
.dia .d1{font-weight:800;font-size:15px}
.dia .d2{font-size:12px;color:var(--creme3);font-weight:600;text-transform:capitalize}
.marcas{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:14px;color:var(--creme2)}
.marcas .ed{text-decoration:underline dotted var(--dourado);text-underline-offset:3px}
.dia .dir{text-align:right;font-size:14px;font-weight:700}
.dia .dir small{display:block;font-size:11.5px;font-weight:700}
.avisos{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}

/* ───── tabela ───── */
.tabela{overflow-x:auto;border-radius:var(--r);border:1px solid var(--linha);background:var(--veludo)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12.5px;font-weight:700;color:var(--creme3);text-align:left;padding:10px 12px;border-bottom:1px solid var(--linha);background:var(--noite2);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--linha);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.n{text-align:right}
tr.clica{cursor:pointer}tr.clica:hover td{background:var(--veludo2)}

/* ───── formulários ───── */
.campo{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.campo label{font-size:13px;font-weight:700;color:var(--creme2)}
.inp{height:46px;border-radius:12px;border:1px solid var(--linha2);background:var(--noite2);padding:0 12px;width:100%;color:var(--creme);color-scheme:dark}
textarea.inp{height:auto;min-height:80px;padding:10px 12px;resize:vertical}
.inp:focus{outline:2px solid rgba(245,181,36,.5);border-color:var(--dourado)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opcoes{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:12px}
.opcoes button{padding:12px 8px;border-radius:14px;border:1px solid var(--linha2);background:var(--noite2);font-weight:700;font-size:13.5px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--creme2)}
.opcoes button i{font-size:24px;color:var(--creme3)}
.opcoes button.on{border:2px solid var(--dourado);background:rgba(245,181,36,.1);color:var(--creme)}
.opcoes button.on i{color:var(--dourado)}
.nota{padding:12px 14px;border-radius:14px;font-size:14px;display:flex;gap:10px;align-items:flex-start;border:1px solid transparent}
.nota i{font-size:19px;flex-shrink:0;margin-top:1px}
.nota.info{background:var(--info-bg);color:#CFE3FF}.nota.warn{background:var(--warn-bg);color:#FFE6A8}
.nota.bad{background:var(--bad-bg);color:#FFC2C2}.nota.ok{background:var(--ok-bg);color:#C8F5E1}

.pedido{padding:14px 16px;border-radius:16px;background:var(--veludo);border:1px solid var(--linha);display:flex;gap:12px;align-items:flex-start}
.pedido + .pedido{margin-top:8px}
.pedido .ico{width:40px;height:40px;border-radius:12px;background:var(--noite2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;color:var(--dourado)}
.pedido b{font-weight:800}
.pedido p{font-size:14px;color:var(--creme2);margin-top:2px}
.historico{font-size:13px;color:var(--creme2);border-left:2px solid var(--linha2);padding-left:10px;margin-top:6px}
.historico div + div{margin-top:4px}
.rodape{display:flex;justify-content:center;gap:6px;margin-top:28px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--creme);color:var(--noite);padding:12px 18px;border-radius:14px;font-weight:700;font-size:14.5px;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:90;max-width:calc(100vw - 32px);animation:pop .2s}
.toast.bad{background:var(--bad);color:#2a0b0b}
.gira{display:inline-block;width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
.carregando{display:flex;align-items:center;justify-content:center;gap:10px;padding:70px 0;color:var(--creme2);font-weight:700}
.faixa{background:var(--warn-bg);color:#FFE6A8;border-radius:14px;padding:10px 14px;font-size:14px;font-weight:600;margin-bottom:14px;display:flex;gap:8px;align-items:center}

/* ───── agenda ───── */
.cal{background:var(--veludo);border:1px solid var(--linha);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.cal-t{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--linha)}
.cal-t b{font-size:17px}
.cal-grade{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-sem{font-size:12px;font-weight:700;color:var(--creme3);text-align:center;padding:8px 0;background:var(--noite2);border-bottom:1px solid var(--linha)}
.cal-dia{min-height:92px;border-right:1px solid var(--linha);border-bottom:1px solid var(--linha);padding:5px;text-align:left;display:flex;flex-direction:column;gap:3px;background:transparent;cursor:pointer;min-width:0;color:var(--creme)}
.cal-dia:nth-child(7n){border-right:0}
.cal-dia:hover{background:var(--veludo2)}
.cal-dia.fora{opacity:.3}
.cal-dia .n{font-size:13px;font-weight:800;color:var(--creme2)}
.cal-dia.hoje .n span{background:var(--vermelho);color:#fff;border-radius:10px;padding:0 7px}
.chip{display:block;font-size:11.5px;font-weight:700;line-height:1.25;padding:2px 6px;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chip.folga{background:rgba(61,220,151,.2);color:#9FF0CC}.chip.ausente,.chip.atestado{background:rgba(127,183,255,.2);color:#BFD9FF}.chip.ferias{background:rgba(190,140,255,.22);color:#E0CCFF}
.chip.cha{background:rgba(227,16,31,.35);color:#FFC9CD}.chip.campanha{background:rgba(245,181,36,.3);color:#FFE6A8}.chip.evento{background:rgba(255,140,60,.28);color:#FFD9BF}.chip.reuniao{background:rgba(127,183,255,.2);color:#BFD9FF}.chip.aviso{background:var(--veludo2);color:var(--creme2)}.chip.feriado{background:transparent;color:var(--creme3);border:1px dashed var(--linha2)}
.chip.mais{background:transparent;color:var(--creme3);padding:0 4px}
.legenda{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

  return {saldo: soma, folgasDisp: soma>0 ? Math.floor(soma/regras.folga_min) : 0, proximas: futuras, folgasMarcadas: futuras.length};
}

async function tecla(k){
  const p = S.pin; if(!p || p.ocupado) return;
  if(k==='bk'){ p.buf=p.buf.slice(0,-1); p.erro=''; renderPin(); return; }
  if(p.buf.length>=6) return;
  p.buf += k; p.erro=''; renderPin();

  p.ocupado = true; renderPin();
  try{
    if(p.alvo==='__admin' || p.alvo==='__aparelho'){
      const cred = await credencial('adminPin', p.buf);
      const d = await api('admDados', cred);
      S.pin=null; renderPin();
      if(p.alvo==='__aparelho'){ S.admCred = cred; abrirAutorizarAparelho(d); return; }
      S.adm = {cred, dados:d, tab: pendentes(d).length ? 'pedidos' : 'hoje', eid:null, mes:mesDe(d.hoje)};
      S.tela='admin'; render();
    } else {
      const cred = await credencial('pin', p.buf);
      const d = await api('entrar', {eid:p.alvo, ...cred});
      S.sess = {eid:p.alvo, cred, dados:d};
      S.pin=null; renderPin(); S.portalTab='inicio'; S.portalMes=mesDe(d.hoje);
      S.tela = modoLoja() ? 'bater' : 'portal'; render();
    }
  }catch(e){
    if(erroRede(e) && p.alvo!=='__admin' && p.alvo!=='__aparelho' && modoLoja()){
      const c = S.boot.colaboradoras.find(x=>x.id===p.alvo);

      S.sess = {eid:p.alvo, cred, dados:null, offline:true, nome:c.nome};
      S.pin=null; renderPin(); S.tela='bater'; render(); return;
    }
    p.ocupado=false; p.buf=''; p.erro=e.message; renderPin();
  }
}

async function bater(campo){
  const s = S.sess; if(S.ocupado) return;
  S.ocupado = true;
  const b = $('#btn-bater'); if(b){ b.disabled=true; b.innerHTML='<span class="gira"></span> Registrando…'; }
  const d = agoraServidor();
  const foto = fotoAgora();
  const pedido = {eid:s.eid, ...s.cred, campo, token:S.aparelho?.token};
  try{
    if(s.offline) throw new TypeError('offline');
    const j = await api('bater', {...pedido, foto});
    const i = s.dados.pontos.findIndex(p=>p.data===j.ponto.data);
    if(i>=0) s.dados.pontos[i]=j.ponto; else s.dados.pontos.push(j.ponto);
    S.ultimo = {campo, hora:j.hora, nome:s.dados.colaboradora.nome, offline:false, foto:!!(j.ponto.fotos && JSON.parse(j.ponto.fotos||'{}')[campo])};
    S.tela='sucesso';
  }catch(e){
    if(erroRede(e)){
      const nome = s.dados ? s.dados.colaboradora.nome : s.nome;
      S.fila.push({...pedido, offline:true, horaAparelho:pad(d.getHours())+':'+pad(d.getMinutes()), dataAparelho:isoD(d), nome});
      salvarFila();
      S.ultimo = {campo, hora:pad(d.getHours())+':'+pad(d.getMinutes()), nome, offline:true};
      S.tela='sucesso';
    } else toast(e.message, true);
  }
  S.ocupado=false; render();
}

function cardPedido(s, admin){

  const periodo = s.data_fim && s.data_fim!==s.data ? ddmm(s.data)+' a '+ddmm(s.data_fim) : dataLonga(s.data);

  if(s.tipo==='correcao') det += ` — ${NOME[s.campo]} para <b class="num">${esc(s.horario)}</b>`;

  }
  const tel = admin ? (S.adm.dados.colaboradoras.find(c=>c.id===s.colaboradora_id)||{}).telefone : '';
  return `<div class="pedido"><div class="ico"><i class="ti ${ico}"></i></div><div class="cresce">

    <p class="apagado" style="font-size:12.5px">Enviado ${esc(s.criada_em.slice(8,10)+'/'+s.criada_em.slice(5,7)+' '+s.criada_em.slice(11,16))}${s.decidido_em?' · respondido '+esc(s.decidido_em.slice(8,10)+'/'+s.decidido_em.slice(5,7)):''}</p>
    ${!admin && s.status==='pendente'?`<button class="btn p fantasma" style="padding:0;margin-top:4px" onclick="cancelarPedido('${s.id}')">Cancelar pedido</button>`:''}
    ${admin && s.status==='pendente'?`<div class="linha" style="margin-top:10px;gap:8px">
      <button class="btn p ok" onclick="decidir('${s.id}',true)"><i class="ti ti-check"></i> Aprovar</button>

async function lerArquivo(inp){
  const f = inp.files[0]; if(!f) return;
  try{
    if(f.type.startsWith('image/')){
      const img = await new Promise((ok,er)=>{ const i = new Image(); i.onload=()=>ok(i); i.onerror=er; i.src=URL.createObjectURL(f); });
      const k = Math.min(1, 1600/Math.max(img.width, img.height));
      const cv = document.createElement('canvas'); cv.width=Math.round(img.width*k); cv.height=Math.round(img.height*k);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      PED.arquivo = {nome:f.name.replace(/\.\w+$/,'')+'.jpg', mime:'image/jpeg', base64: cv.toDataURL('image/jpeg',.82).split(',')[1]};
    } else {
      if(f.size > 10*1024*1024){ toast('Arquivo muito grande (máximo 10 MB)', true); return; }
      const b64 = await new Promise((ok,er)=>{ const r = new FileReader(); r.onload=()=>ok(String(r.result).split(',')[1]); r.onerror=er; r.readAsDataURL(f); });
      PED.arquivo = {nome:f.name, mime:f.type||'application/pdf', base64:b64};
    }
    renderPedido();
  }catch(e){ toast('Não consegui ler o arquivo', true); }
}

  if(e.pin && !/^\d{6}$/.test(e.pin)){ toast('O PIN precisa ter 6 números', true); return; }
  const b = $('#btn-colab'); b.disabled=true;
  try{
    S.adm.dados = await api('admColab', {...S.adm.cred, id:e.id||undefined, nome:e.nome, loja:e.loja, cor:e.cor, admissao:e.admissao, cargo:e.cargo, telefone:e.telefone, saldo_inicial_min:saldo, ativa:e.ativa, pin:e.pin||undefined});

      <img src="${LOGO}" style="height:40px"><div><h1>Espelho de Ponto — ${nomeMes(ym)}</h1><div>${EMPRESA.nome} · CNPJ ${EMPRESA.cnpj}</div></div></div>

    <table style="margin-top:8px"><thead><tr><th>Dia</th>${CAMPOS.map(k=>`<th>${CURTO[k]}</th>`).join('')}<th>Trab.</th><th>Prev.</th><th>Saldo</th><th>Obs.</th></tr></thead><tbody>${linhas}</tbody></table>
    <p style="margin-top:10px"><b>Trabalhado:</b> ${hm(res.trabalhado)} · <b>Previsto:</b> ${hm(res.previsto)} · <b>Saldo do mês:</b> ${hm(res.saldo,true)} · <b>Banco de horas acumulado:</b> ${hm(banco.saldo,true)}</p>
    <p style="margin-top:8px">Declaro que os horários acima conferem com a minha jornada. Caso discorde de algum registro, tenho 5 (cinco) dias úteis a partir do recebimento para contestar por escrito. Saldo credor do banco de horas deve ser compensado até o fim do mês seguinte; o que não for compensado será pago como hora extra com adicional de 50%.</p>
    <div style="display:flex;gap:40px;margin-top:46px">
      <div style="flex:1;border-top:1px solid #000;padding-top:4px;text-align:center">${EMPRESA.nome}<br>Empregadora</div>
      <div style="flex:1;border-top:1px solid #000;padding-top:4px;text-align:center">${esc(c.nome)}<br>Colaboradora</div></div>
    <p style="margin-top:14px;color:#555">Rio Branco/AC, ____ de ______________ de ${ym.slice(0,4)}.</p></div>`;
}
function imprimirEspelho(lista){
  $('#print').innerHTML = lista.map(c=>espelhoHTML(c, S.adm.mes)).join('');
  setTimeout(()=>window.print(), 300);
}
function copiarResumo(){
  const d = S.adm.dados, c = admColabAtual(), ym = S.adm.mes;
  const mapa = mapaPontos(d.pontos, c.id), res = resumoMes(c, ym, mapa, d.regras), banco = bancoTotal(c, mapa, d.regras);
  const txt = `🕐 *Seu ponto de ${nomeMes(ym)}*\n\nOi, ${primeiroNome(c.nome)}! Segue o resumo:\n\n⏱️ *Trabalhado:* ${hm(res.trabalhado)}\n📋 *Previsto:* ${hm(res.previsto)}\n${res.saldo>=0?'➕':'➖'} *Saldo do mês:* ${hm(res.saldo,true)}\n🏦 *Banco de horas:* ${hm(banco.saldo,true)}${banco.folgasDisp?`\n🌴 *Folgas disponíveis:* ${banco.folgasDisp}`:''}${res.pend?`\n\n⚠️ _Tem ${res.pend} dia(s) com marcação pendente. Confere no seu portal e manda a correção por lá._`:''}\n\n_Qualquer dúvida é só chamar_ 💛`;
  const tel = telWa(c.telefone);
  if(tel) window.open('https://wa.me/'+tel+'?text='+encodeURIComponent(txt), '_blank');
  else navigator.clipboard.writeText(txt).then(()=>toast('Resumo copiado ✔ Cole no WhatsApp'), ()=>{ prompt('Copie o texto:', txt); });
}
function exportarCSV(todas){
  const d = S.adm.dados, ym = S.adm.mes;
  const ids = todas ? d.colaboradoras.map(c=>c.id) : [admColabAtual().id];
  const q = v => /[",\n]/.test(v) ? '"'+String(v).replace(/"/g,'""')+'"' : String(v??'');
  const head = 'funcionaria,loja,data,'+CAMPOS.join(',')+',tipo,obs';
  const rows = d.pontos.filter(p=>ids.includes(p.colaboradora_id) && p.data.startsWith(ym)).sort((a,b)=>(a.colaboradora+a.data).localeCompare(b.colaboradora+b.data))
    .map(p=>[p.colaboradora,p.loja,p.data,...CAMPOS.map(k=>p[k]),p.tipo==='normal'?'':p.tipo,p.obs].map(q).join(','));
  const blob = new Blob([String.fromCharCode(0xFEFF)+[head,...rows].join('\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `pontos-${ym}${todas?'':'-'+admColabAtual().id}.csv`; a.click();
}

}
async function salvarApi(){
  const v = $('#api-url').value.trim();
  if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(v)){ toast('Link inválido: precisa terminar em /exec', true); return; }
  S.api = v; LS.set('lv_api', v); S.tela='inicio'; carregar();
}

try{ $('#fav').href = LOGO; }catch(e){}
carregar();
